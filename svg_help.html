<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 渲染器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        textarea {
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
        }
        #svgOutput {
            transition: all 0.3s ease;
        }
        button {
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">SVG 渲染器</h1>
        <p class="text-gray-600 mb-6">请在下方文本框中粘贴 SVG 代码，然后点击渲染按钮查看结果。</p>
        <textarea 
            id="svgInput" 
            class="w-full h-48 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 mb-4" 
            placeholder="粘贴 SVG 代码..."
        ></textarea>
        <button 
            onclick="renderSVG()" 
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
            渲染 SVG
        </button>
        <div 
            id="svgOutput" 
            class="mt-6 border border-gray-200 rounded-lg p-4 bg-gray-50 min-h-[200px] flex items-center justify-center"
        ></div>
    </div>

    <script>
        function renderSVG() {
            const svgInput = document.getElementById('svgInput').value;
            const svgOutput = document.getElementById('svgOutput');
            
            try {
                svgOutput.innerHTML = svgInput;
                const svgElement = svgOutput.querySelector('svg');
                if (!svgElement) {
                    throw new Error('无效的 SVG 代码');
                }
            } catch (error) {
                svgOutput.innerHTML = '<p class="text-red-500 font-medium">错误: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
